<div class="pagination-container mt-3">
    <nav aria-label="Page navigation">
        <ul class="pagination justify-content-center">

            {% if journal_entries.has_previous %}
                <li class="page-item">
                    <a class="page-link" href="?page={{ journal_entries.previous_page_number }}{% if search_val %}&q={{ search_val }}{% endif %}">Previous</a>
                </li>
            {% else %}
                <li class="page-item disabled"><span class="page-link">Previous</span></li>
            {% endif %}

            <!-- {% for i in journal_entries.paginator.page_range %}
                {% if journal_entries.number == i %}
                    <li class="page-item active"><span class="page-link">{{ i }}</span></li>
                {% else %}
                    <li class="page-item">
                        <a class="page-link" href="?page={{ i }}{% if search_val %}&q={{ search_val }}{% endif %}">
                            {{ i }}
                        </a>
                    </li>
                {% endif %}
            {% endfor %} -->

            {% if journal_entries.has_next %}
                <li class="page-item">
                    <a class="page-link" href="?page={{ journal_entries.next_page_number }}{% if search_val %}&q={{ search_val }}{% endif %}">Next</a>
                </li>
            {% else %}
                <li class="page-item disabled"><span class="page-link">Next</span></li>
            {% endif %}
        </ul>
    </nav>
</div>
